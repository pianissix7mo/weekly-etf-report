name: Refactor Send Hotmail Once

on:
  push:
    branches:
      - refactor-safe

permissions:
  contents: read

jobs:
  run-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run offline regression tests
        run: python -m pytest -q

      - name: Run ETF analyst report
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 60
          command: python etf_analyst_report_complete.py

      - name: Send report to Hotmail only
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USER: pianissix7mo@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: pianissix7mo@gmail.com
          EMAIL_TO: mofeiwang@hotmail.com
        run: python send_etf_report_email.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETF-refactor-hotmail-once
          path: |
            etf_analyst_target_outputs/ETF_analyst_report.xlsx
            etf_analyst_target_outputs/ETF_PE_history.xlsx
            etf_analyst_target_outputs/ETF_analyst_report_*.xlsx
          retention-days: 7
