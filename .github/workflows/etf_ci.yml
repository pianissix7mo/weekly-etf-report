name: ETF Continuous Validation

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'etf_report/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - '*.py'
      - 'etf_report/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify syntax
        run: python -m compileall -q etf_analyst_report_complete.py etf_report send_etf_report_email.py tests
      - name: Run regression tests
        run: python -m pytest -q
