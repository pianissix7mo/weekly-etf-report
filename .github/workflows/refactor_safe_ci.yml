name: Refactor Safe CI

on:
  push:
    branches: [refactor-safe]
    paths:
      - "etf_analyst_report_complete.py"
      - "etf_report/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/refactor_safe_ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-safe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile production Python
        run: python -m py_compile etf_analyst_report_complete.py etf_report/*.py send_etf_report_email.py

      - name: Run regression tests
        run: python -m pytest -q
