name: ETF Analyst Report - Legacy Main (No Email)

on:
  workflow_dispatch:

concurrency:
  group: etf-analyst-history-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run ETF analyst report with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 60
          command: python etf_analyst_report_complete.py

      - name: Commit PE history (fail on conflict)
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin main
          # A run must never email a workbook built from an older code
          # revision when calculation/quote-fetching code changed mid-run.
          if ! git diff --quiet HEAD origin/main -- \
            etf_analyst_report_complete.py etf_report/ \
            send_etf_report_email.py requirements.txt; then
            echo "ETF source code changed during the run; refuse stale-code report" >&2
            exit 1
          fi
          git add etf_analyst_target_outputs/ETF_PE_history.xlsx
          if git diff --cached --quiet; then
            echo "PE history unchanged"
          else
            git commit -m "Update ETF PE history (manual)"
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETF-analyst-report
          path: |
            etf_analyst_target_outputs/ETF_analyst_report.xlsx
            etf_analyst_target_outputs/ETF_PE_history.xlsx
            etf_analyst_target_outputs/ETF_analyst_report.delivery.json
            etf_analyst_target_outputs/ETF_analyst_report_*.xlsx
          if-no-files-found: error
          retention-days: 30

