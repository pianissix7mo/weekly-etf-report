name: DRAM Holdings Diagnostic Once

on:
  push:
    branches:
      - refactor-safe

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Inspect real DRAM holdings tables
        run: |
          python - <<'PY'
          from io import StringIO
          import pandas as pd
          import etf_analyst_report_complete as p

          url = p.ETF_CONFIG["DRAM"]["url"]
          art = p.fetch_rendered_artifacts(
              url,
              click_texts=["Top Holdings", "View All", "View All +", "Holdings"],
              download_texts=["Download CSV", "CSV", "Export"],
              wait_seconds=7,
          )
          print("download_name=", art.get("download_name"))
          print("download_bytes=", len(art.get("download_bytes") or b""))
          if art.get("download_bytes"):
              print("=== DOWNLOAD TABLES ===")
              for i, df in enumerate(p.read_any_file_to_tables(art["download_bytes"])):
                  print(f"--- download table {i}: shape={df.shape} columns={list(df.columns)}")
                  print(df.head(30).to_string(index=False))
          print("=== HTML TABLES ===")
          tables = pd.read_html(StringIO(art.get("html", "")))
          for i, df in enumerate(tables):
              if i in (2, 3, 12, 13) or len(df) >= 8:
                  print(f"--- html table {i}: shape={df.shape} columns={list(df.columns)}")
                  print(df.head(40).to_string(index=False))
          PY
