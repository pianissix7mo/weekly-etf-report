name: DRAM Live Verification Once

on:
  push:
    branches:
      - refactor-safe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run regression tests
        run: python -m pytest -q
      - name: Run live DRAM integration
        run: |
          python - <<'PY'
          import etf_analyst_report_complete as p

          holdings = p.pull_issuer_holdings("DRAM")
          print("DRAM_NORMALIZED_ROWS=", len(holdings))
          print("DRAM_NORMALIZED_WEIGHT=", round(float(holdings["Weight"].sum()), 4))
          print(holdings[["Yahoo Ticker", "Weight", "Name"]].to_string(index=False))

          enriched = p.calculate_returns(p.add_yahoo_targets(holdings))
          summary = p.summarize_etf(enriched, "DRAM")
          p.print_summary(summary)
          print("DRAM_FORWARD_PE=", summary.get("Forward PE"))
          print("DRAM_FORWARD_PE_COVERAGE=", summary.get("Forward PE Coverage Weight"))
          PY
