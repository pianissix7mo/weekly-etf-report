name: ETF Foreign Closing Price Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etf_foreign_quote_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'yfinance>=0.2,<1' requests beautifulsoup4
      - name: Verify Amsterdam dated close
        run: |
          python - <<'PY'
          from etf_report.prices import fetch_public_dated_close, fetch_dated_close
          import yfinance as yf
          expected = "2026-11-10"
          public_price, public_date = fetch_public_dated_close("BESI.AS", expected)
          print(f"PUBLIC BESI.AS: {public_date} EUR {public_price}", flush=True)
          if public_date != expected or not 150 <= public_price <= 152:
              raise RuntimeError("Cannot verify BESI Amsterdam closing price")
          live_price, live_date = fetch_dated_close(yf.Ticker("BESI.AS"), "BESI.AS")
          print(f"FALLBACK BESI.AS: {live_date} EUR {live_price}", flush=True)
          if live_date != expected or not 150 <= live_price <= 152:
              raise RuntimeError("Fallback did not recover BESI Amsterdam close")
          PY
