name: DRAM Verification Once

on:
  push:
    branches:
      - refactor-safe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run regression tests
        run: python -m pytest -q
      - name: Run full ETF report
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 60
          command: python etf_analyst_report_complete.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ETF-DRAM-verification
          path: |
            etf_analyst_target_outputs/ETF_analyst_report.xlsx
            etf_analyst_target_outputs/ETF_PE_history.xlsx
          retention-days: 7
