name: DRAM Source Verify Once

on:
  push:
    branches:
      - refactor-safe

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run regression tests
        run: python -m pytest -q
      - name: Verify live DRAM holdings only
        run: |
          python - <<'PY'
          import etf_analyst_report_complete as p
          h = p.pull_issuer_holdings("DRAM")
          print(h[["Yahoo Ticker","Name","Weight"]].to_string(index=False))
          print(f"DRAM_ROWS={len(h)}")
          print(f"DRAM_TOTAL_WEIGHT={h['Weight'].sum():.4f}")
          assert len(h) >= 8
          assert 90 <= h["Weight"].sum() <= 110
          assert "MU" in set(h["Yahoo Ticker"])
          assert "005930.KS" in set(h["Yahoo Ticker"])
          assert "000660.KS" in set(h["Yahoo Ticker"])
          assert "285A.T" in set(h["Yahoo Ticker"])
          PY
