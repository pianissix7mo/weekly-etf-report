name: ETF Analyst Report - Production

on:
  workflow_dispatch:
  schedule:
    - cron: "15 16 * * 1-5"
      timezone: "America/Toronto"

permissions:
  contents: write

jobs:
  run-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run ETF analyst report with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 60
          command: python etf_analyst_report_complete.py

      - name: Commit main PE history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add etf_analyst_target_outputs/ETF_PE_history.xlsx
          git commit -m "Update ETF PE history" || echo "No PE history changes to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETF-analyst-report-production
          path: |
            etf_analyst_target_outputs/ETF_analyst_report.xlsx
            etf_analyst_target_outputs/ETF_PE_history.xlsx
            etf_analyst_target_outputs/ETF_analyst_report_*.xlsx
          retention-days: 30

      - name: Send ETF report email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USER: pianissix7mo@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: pianissix7mo@gmail.com
          EMAIL_TO: mofeiwang@hotmail.com,mofeiwang@yahoo.ca
        run: python send_etf_report_email.py
