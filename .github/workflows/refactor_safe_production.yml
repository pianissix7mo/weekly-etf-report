name: ETF Analyst Report - Production

on:
  workflow_dispatch:
  schedule:
    - cron: "15 16 * * 1-5"
      timezone: "America/Toronto"

# Share a serialization lock with the legacy manual workflow. Two runs may
# otherwise try to push different versions of the binary PE history workbook.
concurrency:
  group: etf-analyst-history-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run ETF analyst report with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_wait_seconds: 60
          command: python etf_analyst_report_complete.py

      - name: Commit main PE history (fail on conflict)
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add etf_analyst_target_outputs/ETF_PE_history.xlsx
          if git diff --cached --quiet; then
            echo "PE history unchanged; nothing to commit"
          else
            git commit -m "Update ETF PE history"
            # Never swallow a binary workbook rebase conflict. If this fails,
            # the job must fail BEFORE artifact upload and email sending.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETF-analyst-report-production
          path: |
            etf_analyst_target_outputs/ETF_analyst_report.xlsx
            etf_analyst_target_outputs/ETF_PE_history.xlsx
            etf_analyst_target_outputs/ETF_analyst_report_*.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Send ETF report email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USER: pianissix7mo@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: pianissix7mo@gmail.com
          EMAIL_TO: mofeiwang@hotmail.com,mofeiwang@yahoo.ca
        run: python send_etf_report_email.py
